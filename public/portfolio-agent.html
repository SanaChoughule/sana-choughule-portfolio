function head(kicker,title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function stat(label,val,meta,dark=false){return `<div class="stat ${dark?'dark':''}"><div class="label">${label}</div><div class="value">${val}</div><div class="meta">${meta}</div></div>`}
function card(item){return `<article class="work-card"><div class="work-img"><img src="${esc(item.image||pics.portrait)}" alt="${esc(item.title)}"><span class="image-chip">${esc(item.source)}</span>${item.featured?'<span class="image-chip right">FEATURED</span>':''}</div><div class="work-content"><div class="category">${esc(catName(item.cat))}</div><h3>${esc(item.title)}</h3><p>${esc(item.desc)}</p><div class="work-foot"><span>${item.published?'Published to portfolio':'Draft · Needs review'}</span><span class="confidence">AI ${item.confidence||'—'}%</span></div><div class="work-foot"><button class="linkbtn" data-action="edit-item" data-id="${item.id}">Review / edit</button><button class="linkbtn" data-action="toggle-feature" data-id="${item.id}">${item.featured?'Unfeature':'Feature'} ☆</button></div></div></article>`}
function queueRow(j){return `<div class="queue-row"><div class="queue-icon ${j.status==='Review required'?'amber':''}">${j.status==='Published'?'✓':'◷'}</div><div><strong>${esc(j.name)}</strong><small>${esc(j.source)} · ${esc(j.time)}</small><p>${esc(j.status)} · ${esc(j.detail)}</p>${j.status==='Review required'?`<button class="linkbtn" data-action="review-job" data-id="${j.id}">Open review →</button>`:''}</div></div>`}
function overview(){const pub=data.items.filter(i=>i.published).length,featured=data.items.filter(i=>i.featured).length,pending=data.jobs.filter(j=>j.status==='Review required');return `${head('STUDIO CMS ENGINE','Curatorial Overview','A calm command centre for bringing creative work in, shaping its story, and deciding what reaches the public portfolio.',`<button class="btn" data-action="public">◎ Open Public Site</button><button class="btn dark" data-action="ingest">＋ Ingest Media</button>`)}<div class="grid4">${stat('Total portfolio works',data.items.length,`${pub} published · ${data.items.length-pub} drafts`)}${stat('Active taxonomies',data.categories.length,'Creator-defined collections')}${stat('Featured spotlights',featured,'Priority in public grid')}${stat('Autopilot engine',data.settings.autopilot?'Autonomous':'Manual',data.settings.approval?'Human approval required':'Auto-publish',true)}</div>${pending.length?`<div class="banner"><div><strong>${pending.length} item awaiting creator approval</strong><p>Metadata and category suggestions are ready. Keep creative judgement in the loop.</p></div><button class="btn" data-action="review-job" data-id="${pending[0].id}">Review first item →</button></div>`:''}<div class="section two-col"><section><div class="section-title"><div><h2>Recent portfolio works</h2><p>Your latest published pieces and drafts</p></div><button class="linkbtn" data-tab="portfolio">View all →</button></div><div class="work-grid">${data.items.slice(0,4).map(card).join('')}</div></section><aside><div class="queue"><div class="section-title"><div><h2>Ingestion queue</h2><p>Recent processing activity</p></div><span class="tag">LIVE DEMO</span></div><div class="queue-list">${data.jobs.slice(0,4).map(queueRow).join('')}</div><button class="btn ghost" style="width:100%;margin-top:10px" data-tab="activity">View activity history →</button></div><div class="note-card" style="margin-top:14px"><div class="eyebrow">PRODUCT PRINCIPLE</div><h3>Human taste stays in the loop.</h3><p>PortfolioPilot proposes a first pass at titles, descriptions, tags and categories. The creator stays in control of the final edit and publishing decision.</p></div></aside></div>`}
function portfolio(){let items=data.items.filter(i=>(filter==='all'||i.cat===filter)&&(!query||`${i.title} ${i.desc} ${i.tags.join(' ')}`.toLowerCase().includes(query.toLowerCase())));return `${head('CREATIVE LIBRARY','Portfolio Management','Organise the work, refine its metadata, and control what is visible on your public portfolio.',`<button class="btn dark" data-action="ingest">＋ Add new work</button>`)}<div class="toolbar"><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">All works</button>${data.categories.map(c=>`<button class="filter ${filter===c.id?'active':''}" data-filter="${c.id}">${esc(c.name)}</button>`).join('')}</div><input class="search" id="searchItems" placeholder="Search titles, descriptions, tags…" value="${esc(query)}"></div><div class="section-title"><span class="eyebrow">${items.length} WORKS SHOWN</span><span class="eyebrow">Changes stay in this browser</span></div><div class="work-grid">${items.length?items.map(card).join(''):'<div class="empty" style="grid-column:1/-1">No portfolio work matches these filters.</div>'}</div>`}
function categories(){return `${head('CLASSIFICATION SYSTEM','Category Management','Create the collections that shape how the public portfolio is browsed.',`<button class="btn dark" data-action="new-category">＋ New category</button>`)}<div class="cards3">${data.categories.map(c=>`<article class="category-card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="swatch" style="background:${c.color}"></span><span class="eyebrow">${data.items.filter(i=>i.cat===c.id).length} WORKS</span></div><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="meta"><span>/${esc(c.slug)}</span><button class="linkbtn" data-action="edit-category" data-id="${c.id}">Edit category</button></div></article>`).join('')}</div>`}
function activity(){return `${head('PROCESSING HISTORY','AI Activity','Follow each ingestion through validation, visual analysis, metadata suggestions and a creator-controlled review.',`<span class="tag">SIMULATED PIPELINE</span>`)}<div class="activity-layout"><section class="activity-card"><div class="section-title"><div><h2>Recent processing</h2><p>Latest media-ingestion jobs</p></div></div>${data.jobs.map(j=>`<div class="activity-row"><span class="activity-dot" style="background:${j.status==='Published'?'#738775':'#b88648'}"></span><div><strong>${esc(j.name)}</strong><p>${esc(j.detail)}</p><small>${esc(j.id)} · ${esc(j.source)} · ${esc(j.time)} · ${esc(j.status)}</small>${j.status==='Review required'?`<br><button class="linkbtn" data-action="review-job" data-id="${j.id}">Open creator review →</button>`:''}</div></div>`).join('')}</section><aside class="activity-card"><div class="eyebrow">PROPOSED INGESTION FLOW</div><h2 style="font:500 31px var(--serif);margin:8px 0">From upload to showcase.</h2><ol class="step-list">${['Media received','Format and integrity checks','Keyframe / visual analysis','Metadata and tag suggestions','Category and placement match','Creator review and approval','Publish to portfolio'].map((s,i)=>`<li><span class="step-no">${String(i+1).padStart(2,'0')}</span>${s}</li>`).join('')}</ol><div class="notice">Demo boundary: the timeline and AI suggestions in this standalone file are simulated. No Gemini call, background worker or cloud publishing job is running.</div></aside></div>`}
function website(){return `${head('PUBLIC EXPERIENCE','Website Builder','Shape the creator identity and preview how approved work is presented to visitors.',`<button class="btn" data-action="public">↗ Preview public site</button>`)}<div class="builder"><section class="panel"><h2>Portfolio identity</h2><p class="panel-sub">Presentation details for the public-facing portfolio.</p><label class="field"><span>Headline</span><input id="headline" value="${esc(data.settings.headline)}"></label><label class="field"><span>Biography</span><textarea id="bio">${esc(data.settings.bio)}</textarea></label><label class="field"><span>Location</span><input id="location" value="${esc(data.settings.location)}"></label><label class="field"><span>Visual template</span><select id="template">${['Editorial Minimal','Monochrome Brutalist','Warm Cinematic'].map(x=>`<option ${data.settings.template===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>Grid order</span><select id="grid">${['Featured first','Newest first','Manual order'].map(x=>`<option ${data.settings.grid===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="btn dark" style="width:100%" data-action="save-site">Save preview settings</button></section><section class="preview"><div class="eyebrow" style="display:flex;justify-content:space-between"><span>PUBLIC PORTFOLIO · PREVIEW</span><span>DESKTOP VIEW</span></div><div class="preview-inner"><div class="eyebrow">SELECTED WORKS · ${esc(data.settings.location)}</div><h2>${esc(data.settings.headline)}</h2><p>${esc(data.settings.bio)}</p><div class="preview-grid">${data.items.filter(i=>i.published).slice(0,4).map(i=>`<div><img src="${esc(i.image)}" alt=""><div style="font:500 21px var(--serif);margin-top:5px">${esc(i.title)}</div></div>`).join('')}</div><div class="eyebrow" style="border-top:1px solid var(--line);padding-top:14px;margin-top:28px">PUBLISHED WITH PORTFOLIOPILOT · CONCEPT PREVIEW</div></div></section></div>`}
function settings(){const rows=[['autopilot','Autopilot enabled','Allow the proposed workflow to prepare curation suggestions.'],['approval','Creator approval required','Keep a human review step before an item is published.'],['metadata','AI metadata suggestions','Suggest titles, descriptions and tags for review.'],['categorization','Automatic category matching','Recommend a category based on the creative work.'],['autoPublish','Automatic publishing','Publish without a manual review step.'],['compression','Smart image optimisation','A planned publishing preference; no image processing runs here.'],['watermark','Watermark on public images','A presentation preference for a future publishing workflow.']];return `${head('WORKSPACE CONTROLS','Studio Settings','Set how the proposed automation prepares, organises and publishes creative work.',`<button class="btn" data-action="reset">↻ Reset demo data</button>`)}<div class="settings-grid"><section class="panel"><h2>Workflow preferences</h2><p class="panel-sub">Switches update this local prototype only.</p>${rows.map(([key,title,desc])=>`<div class="setting-row"><div><strong>${title}</strong><p>${desc}</p></div><button class="switch ${data.settings[key]?'on':''}" data-setting="${key}" aria-label="Toggle ${title}"></button></div>`).join('')}</section><aside class="note-card"><div class="eyebrow">PROTOTYPE BOUNDARIES</div><h3>Designed to explain the workflow, not impersonate a live service.</h3><p>Sample work, status history and metadata suggestions are illustrative. This prototype does not connect to Gemini, download Instagram media, upload assets to cloud storage, or publish a remotely hosted creator website. Uploaded images are temporary in this browser session.</p></aside></div>`}
function publicSite(){const items=data.items.filter(i=>i.published&&(filter==='all'||i.cat===filter));return `<div class="pagehead"><div><div class="eyebrow">VISITOR EXPERIENCE · SELECTED WORKS</div><h1>${esc(data.settings.headline)}</h1><p>${esc(data.settings.bio)}</p><div class="eyebrow" style="margin-top:12px">${esc(data.settings.location)}</div></div><div class="head-actions"><button class="btn" data-action="back">← Back to Studio CMS</button></div></div><div class="filters" style="margin:22px 0">${[['all','All works'],...data.categories.map(c=>[c.id,c.name])].map(([id,label])=>`<button class="filter ${filter===id?'active':''}" data-filter="${id}">${esc(label)}</button>`).join('')}</div><div class="public-grid">${items.map(i=>`<article class="public-item"><button data-action="lightbox" data-id="${i.id}" style="border:0;background:none;padding:0;width:100%;text-align:left"><img src="${esc(i.image)}" alt="${esc(i.title)}"><h3>${esc(i.title)}</h3><div class="category">${esc(catName(i.cat))}</div><p>${esc(i.desc)}</p></button></article>`).join('')||'<div class="empty" style="grid-column:1/-1">No published work in this collection.</div>'}</div>`}
function render(){header();$('#main').innerHTML=publicView?publicSite():({overview,portfolio,categories,activity,website,settings}[tab]||overview)();}
function modal(html){$('#modalRoot').innerHTML=`<div class="backdrop" data-backdrop><section class="modal">${html}</section></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function ingest(){modal(`<div class="modal-head"><div><div class="eyebrow">MEDIA INGESTION · DEMO</div><h2>Add new creative work</h2></div><button class="xbtn" data-action="close">×</button></div><div class="modal-body"><div class="tabs"><button class="${modalTab==='upload'?'active':''}" data-modal-tab="upload">Direct photo / video upload</button><button class="${modalTab==='instagram'?'active':''}" data-modal-tab="instagram">Instagram Reel URL</button></div>${modalTab==='upload'?`<label class="dropzone"><input id="mediaFile" type="file" accept="image/*,video/*" hidden><div style="font-size:25px">↥</div><strong>${uploadData?.name||'Drop a master file here or browse'}</strong><small>JPG, PNG, WebP, MP4 or MOV · up to 100 MB in the source app</small></label>${uploadData?.preview?`<img src="${uploadData.preview}" style="margin-top:12px;max-width:100%;max-height:150px;object-fit:contain;border-radius:7px">`:''}<div class="eyebrow" style="margin-top:18px">ONE-CLICK SAMPLE WORKFLOWS</div><div class="sample-row">${[['fashion','Fashion editorial'],['cinema','Cinema still'],['architecture','Architecture'],['street','Street story']].map(([key,label])=>`<button class="sample" data-sample="${key}"><img src="${pics[key]}"><span>${label}</span></button>`).join('')}</div>`:`<label class="field"><span>Instagram post or Reel URL</span><input id="reelUrl" placeholder="https://www.instagram.com/reel/…"></label><p id="reelMsg" class="panel-sub">Paste a public post or Reel URL. This demo only checks the URL pattern; it does not retrieve media.</p><button class="btn" data-action="validate-reel">Check URL format</button>`}<div class="notice">Prototype note: the next steps simulate media processing and AI curation locally. No actual file is uploaded and no live AI API is called.</div></div><div class="modal-actions"><button class="btn" data-action="close">Cancel</button><button class="btn dark" data-action="start-ingest">Start demo curation →</button></div>`);}
function startIngest(){if(modalTab==='instagram'){const v=$('#reelUrl')?.value||'';if(!/instagram\.com\/(reel|reels|p)\/[\w-]+/i.test(v)){notify('Enter a valid Instagram post or Reel URL.');return}uploadData={name:'Instagram Reel import',source:v,preview:pics.cinema,cat:'film'}}if(modalTab==='upload'&&!uploadData){notify('Choose an image, video or sample first.');return}let step=0;modal(`<div class="modal-head"><div><div class="eyebrow">SIMULATED WORKFLOW</div><h2>Preparing your creative work</h2></div></div><div class="modal-body"><p id="processLabel" class="panel-sub">Validating media file…</p><div class="progress"><i id="processBar"></i></div><ol class="step-list" id="processSteps">${['Validating media format','Extracting a representative frame','Analysing composition and visual themes','Suggesting metadata and category','Preparing creator review'].map((x,i)=>`<li><span class="step-no">${String(i+1).padStart(2,'0')}</span>${x}</li>`).join('')}</ol><div class="notice">This is a visual simulation for portfolio review. No background AI job is running.</div></div>`);const labels=['Validating media format…','Extracting a representative frame…','Analysing composition and visual themes…','Preparing metadata suggestions…','Ready for creator review.'];const bar=$('#processBar');const label=$('#processLabel');const timer=setInterval(()=>{step++;bar.style.width=(step*20)+'%';label.textContent=labels[Math.min(step-1,4)];if(step===5){clearInterval(timer);const cat=uploadData.cat||'fashion';const nm=uploadData.name||'New Creative Study';const item={id:'i'+Date.now(),title:nm.replace(/\.[^.]+$/,'').replace(/[-_]/g,' '),desc:'A considered visual study. Refine this description and confirm the category before publishing.',cat,tags:['New work','Curated','Portfolio'],image:uploadData.type==='video'?pics.cinema:(uploadData.preview||pics.portrait),preview:uploadData.type==='video'?uploadData.preview:'',type:uploadData.type||'photo',published:false,featured:false,source:uploadData.source?'Instagram Reel':'Direct upload',confidence:94};reviewItem=item;setTimeout(()=>review(),350)}} ,650)}
function review(){if(!reviewItem)return;const i=reviewItem;modal(`<div class="modal-head"><div><div class="eyebrow">CURATORIAL VERIFICATION · DEMO</div><h2>Review & placement</h2></div><button class="xbtn" data-action="close">×</button></div><div class="modal-body"><div class="review-layout"><div>${i.type==='video'&&i.preview?`<video class="review-photo" src="${esc(i.preview)}" controls></video>`:`<img class="review-photo" src="${esc(i.image)}">`}<div class="review-score"><div class="eyebrow">SUGGESTION CONFIDENCE</div><strong>${i.confidence}%</strong><div class="panel-sub" style="margin:3px 0 0">Illustrative score</div></div></div><div><label class="field"><span>Curatorial title</span><input id="reviewTitle" value="${esc(i.title)}"></label><label class="field"><span>Description</span><textarea id="reviewDesc">${esc(i.desc)}</textarea></label><label class="field"><span>Category</span><select id="reviewCat">${data.categories.map(c=>`<option value="${c.id}" ${c.id===i.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field"><span>Tags · comma separated</span><input id="reviewTags" value="${esc(i.tags.join(', '))}"></label><label class="field"><span>Publishing choice</span><select id="reviewPublish"><option value="true">Approve and publish</option><option value="false">Save as draft</option></select></label></div></div><div class="notice">These are placeholder metadata suggestions, not live Gemini output. Review and edit before approval.</div></div><div class="modal-actions"><button class="btn warn" data-action="reject-review">Reject draft</button><div style="display:flex;gap:8px"><button class="btn" data-action="close">Save for later</button><button class="btn dark" data-action="approve-review">Approve & save →</button></div></div>`)}
function saveReview(){if(!reviewItem)return;const i={...reviewItem,title:$('#reviewTitle').value.trim()||'Untitled creative work',desc:$('#reviewDesc').value.trim(),cat:$('#reviewCat').value,tags:$('#reviewTags').value.split(',').map(s=>s.trim()).filter(Boolean),published:$('#reviewPublish').value==='true'};delete i.preview;const existingIndex=data.items.findIndex(x=>x.id===i.id);if(existingIndex>=0)data.items[existingIndex]=i;else data.items.unshift(i);data.jobs.unshift({id:'J-'+Date.now(),name:i.title,source:i.source,status:i.published?'Published':'Draft saved',time:'Just now',detail:i.published?'Approved and added to public portfolio.':'Saved as a draft for later review.'});data.jobs=data.jobs.slice(0,8);persist();reviewItem=null;uploadData=null;closeModal();render();notify(i.published?'Work approved and published in the demo portfolio.':'Draft saved in the demo portfolio.')}
function newCategory(existing){const c=existing||{id:'cat'+Date.now(),name:'',desc:'',color:'#9b8974'};modal(`<div class="modal-head"><div><div class="eyebrow">TAXONOMY EDITOR</div><h2>${existing?'Edit':'Create'} category</h2></div><button class="xbtn" data-action="close">×</button></div><div class="modal-body"><label class="field"><span>Category name</span><input id="catTitle" value="${esc(c.name)}" placeholder="e.g. Travel & Landscape"></label><label class="field"><span>Description</span><textarea id="catDesc">${esc(c.desc)}</textarea></label><label class="field"><span>Accent colour</span><input id="catColor" type="color" value="${c.color}"></label></div><div class="modal-actions"><button class="btn" data-action="close">Cancel</button><button class="btn dark" data-action="save-category" data-id="${c.id}">Save category</button></div>`)}
function saveSite(){data.settings.headline=$('#headline').value;data.settings.bio=$('#bio').value;data.settings.location=$('#location').value;data.settings.template=$('#template').value;data.settings.grid=$('#grid').value;persist();render();notify('Portfolio identity updated in this browser.')}
function showLightbox(id){const i=data.items.find(x=>x.id===id);if(!i)return;modal(`<div class="modal-head"><div><div class="eyebrow">${esc(catName(i.cat))}</div><h2>${esc(i.title)}</h2></div><button class="xbtn" data-action="close">×</button></div><img src="${esc(i.image)}" style="display:block;width:100%;max-height:60vh;object-fit:contain;background:#181818"><div class="modal-body"><p style="line-height:1.8;color:#77736c">${esc(i.desc)}</p><div class="eyebrow">${esc(i.tags.join(' · '))}</div></div>`)}
function reset(){if(confirm('Reset the PortfolioPilot prototype to its original sample content?')){data=structuredClone(seed);persist();tab='overview';publicView=false;filter='all';query='';render();notify('Sample workspace restored.')}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});$('#mobileNav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-backdrop]');if(!b)return;const a=b.dataset.action;if(a==='home'){setTab('overview')}else if(a==='public'){publicView=true;filter='all';render()}else if(a==='back'){publicView=false;filter='all';render()}else if(a==='ingest'){modalTab='upload';uploadData=null;ingest()}else if(a==='close'){closeModal()}else if(a==='reset'){reset()}else if(a==='save-site'){saveSite()}else if(a==='new-category'){newCategory()}else if(a==='save-category'){const id=b.dataset.id,old=data.categories.find(c=>c.id===id);const name=$('#catTitle').value.trim();if(!name){notify('Add a category name first.');return}const updated={id,name,desc:$('#catDesc').value,color:$('#catColor').value,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')};if(old)Object.assign(old,updated);else data.categories.push(updated);persist();closeModal();render();notify('Category saved.')}else if(a==='edit-category'){newCategory(data.categories.find(c=>c.id===b.dataset.id))}else if(a==='start-ingest'){startIngest()}else if(a==='validate-reel'){const v=$('#reelUrl')?.value||'';const m=v.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/i);$('#reelMsg').textContent=m?`Recognised Instagram shortcode ${m[1]}. This only checks the URL format; media retrieval is not connected.`:'Please enter a valid Instagram Reel or post URL.'}else if(a==='approve-review'){saveReview()}else if(a==='reject-review'){reviewItem=null;closeModal();notify('Draft rejected in the prototype.')}else if(a==='review-job'){const j=data.jobs.find(x=>x.id===b.dataset.id);reviewItem={id:'r'+Date.now(),title:j?.name||'Creative work',desc:'A carefully composed visual study. Refine the editorial statement and confirm placement.',cat:'documentary',tags:['Editorial','Visual story','Curated'],image:pics.street,confidence:92,source:j?.source||'Direct upload'};review()}else if(a==='edit-item'){const i=data.items.find(x=>x.id===b.dataset.id);reviewItem={...i};review()}else if(a==='toggle-feature'){const i=data.items.find(x=>x.id===b.dataset.id);i.featured=!i.featured;persist();render();notify(i.featured?'Added to featured works.':'Removed from featured works.')}else if(a==='lightbox'){showLightbox(b.dataset.id)}else if(b.dataset.tab){setTab(b.dataset.tab)}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.modalTab){modalTab=b.dataset.modalTab;ingest()}else if(b.dataset.sample){uploadData={name:({fashion:'Monolith Runway AW26 lookbook',cinema:'Anamorphic sunset sequence',architecture:'Desert brutalist sanctuary',street:'Tokyo rain reflection street series'})[b.dataset.sample],preview:pics[b.dataset.sample],cat:b.dataset.sample==='cinema'?'film':b.dataset.sample==='architecture'?'architecture':b.dataset.sample==='street'?'documentary':'fashion'};ingest()}else if(b.hasAttribute('data-setting')){const k=b.dataset.setting;data.settings[k]=!data.settings[k];persist();render()}else if(b.hasAttribute('data-backdrop')&&e.target===b){closeModal()}});
document.addEventListener('change',e=>{if(e.target.id==='mediaFile'){const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')&&!f.type.startsWith('video/')){notify('Choose a photo or video file.');return}const rd=new FileReader();rd.onload=()=>{uploadData={name:f.name,preview:rd.result,cat:'fashion',type:f.type.startsWith('video/')?'video':'photo'};ingest()};rd.readAsDataURL(f)}});
document.addEventListener('input',e=>{if(e.target.id==='searchItems'){query=e.target.value;const pos=e.target.selectionStart;const el=e.target;const oldY=window.scrollY;const value=portfolio();$('#main').innerHTML=value;const n=$('#searchItems');n.focus();n.setSelectionRange(pos,pos);window.scrollTo(0,oldY)}});
render();
})();
</script></body></html>
