function render(){renderHeader();$('#main').innerHTML=({timeline,matrix,focus,habits,velocity}[activeTab]||timeline)();if(activeTab==='focus')updateRing()}
function modal(html){$('#modalRoot').innerHTML=`<div class="backdrop" data-backdrop><section class="modal">${html}</section></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function quickAdd(time='10:00',existing=null){let t=existing||{id:'t'+uid(),title:'',desc:'',category:'deep_work',priority:'p2_high',quadrant:'schedule',status:'todo',estimated:45,completed:0,dueDate:selectedDate,dueTime:time,tags:[]};modal(`<div class="modal-head"><div><div class="kicker">TASK CAPTURE · LOCAL DEMO</div><h2>${existing?'Edit task':'Add a task'}</h2></div><button class="icon-btn" data-action="close">×</button></div><form id="taskForm"><div class="modal-body"><label class="field"><span>Task title</span><input name="title" required value="${esc(t.title)}" placeholder="What needs your attention?"></label><label class="field"><span>Description / notes</span><textarea name="desc" placeholder="Add context or a next action…">${esc(t.desc)}</textarea></label><div class="field-grid"><label class="field"><span>Category</span><select name="category">${Object.entries(cats).map(([k,c])=>`<option value="${k}" ${t.category===k?'selected':''}>${c.label}</option>`).join('')}</select></label><label class="field"><span>Priority</span><select name="priority">${Object.entries(pri).map(([k,v])=>`<option value="${k}" ${t.priority===k?'selected':''}>${v[0]}</option>`).join('')}</select></label><label class="field"><span>Quadrant</span><select name="quadrant">${Object.entries(quad).map(([k,v])=>`<option value="${k}" ${t.quadrant===k?'selected':''}>${v.badge} · ${v.title}</option>`).join('')}</select></label><label class="field"><span>Estimated minutes</span><input type="number" name="estimated" min="5" step="5" value="${t.estimated}"></label><label class="field"><span>Due date</span><input type="date" name="dueDate" value="${t.dueDate}"></label><label class="field"><span>Start time · optional</span><input type="time" name="dueTime" value="${t.dueTime||''}"></label></div></div><div class="modal-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button type="submit" class="primary">${existing?'Save changes':'Create task'} →</button></div></form>`);$('#taskForm').dataset.id=existing?.id||''}
function openTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;quickAdd(t.dueTime||'10:00',t)}
function addTask(form){const f=new FormData(form),id=form.dataset.id||'t'+uid();const old=state.tasks.find(t=>t.id===id);const t={id,title:f.get('title').trim(),desc:f.get('desc').trim(),category:f.get('category'),priority:f.get('priority'),quadrant:f.get('quadrant'),status:old?.status||'todo',estimated:+f.get('estimated')||30,completed:old?.completed||0,dueDate:f.get('dueDate')||selectedDate,dueTime:f.get('dueTime')||'',tags:old?.tags||[]};if(old)Object.assign(old,t);else state.tasks.unshift(t);if(t.dueTime){const start=t.dueTime,[h,m]=start.split(':').map(Number);const endmin=Math.min(23*60+55,h*60+m+t.estimated);const end=String(Math.floor(endmin/60)).padStart(2,'0')+':'+String(endmin%60).padStart(2,'0');const existing=state.blocks.find(b=>b.taskId===id&&b.date===t.dueDate);if(existing)Object.assign(existing,{title:t.title,category:t.category,start,end,done:false});else state.blocks.push({id:'b'+uid(),taskId:id,title:t.title,category:t.category,date:t.dueDate,start,end,done:false})}persist();closeModal();render();notify(old?'Task updated.':'Task captured and added to your day.')}
function autoSchedule(){const pending=state.tasks.filter(t=>t.status!=='completed'&&t.dueDate===selectedDate&&!state.blocks.some(b=>b.taskId===t.id&&b.date===selectedDate));if(!pending.length){notify('No unscheduled tasks for this day.');return}let hour=18;let added=0;pending.slice(0,3).forEach(t=>{let found=false;while(hour<21&&!found){const start=String(hour).padStart(2,'0')+':00';const endHour=hour+Math.max(1,Math.ceil(Math.min(60,t.estimated)/60));const end=String(Math.min(22,endHour)).padStart(2,'0')+':00';const conflict=state.blocks.some(b=>b.date===selectedDate&&start<b.end&&end>b.start);if(!conflict){state.blocks.push({id:'b'+uid(),taskId:t.id,title:t.title,category:t.category,date:selectedDate,start,end,done:false});t.dueTime=start;found=true;added++}hour++}});persist();render();notify(added?`${added} task${added>1?'s':''} added to open time slots.`:'No open time slots found.')}
function updateTaskStatus(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status=t.status==='completed'?'todo':'completed';if(t.status==='completed')t.completed=t.estimated;state.blocks.forEach(b=>{if(b.taskId===id)b.done=t.status==='completed'});persist();render();notify(t.status==='completed'?'Task completed.':'Task reopened.')}
function updateRing(){const ring=$('#ringProgress');const clock=$('#clockText');if(!ring||!clock)return;const total=focusModes[focusMode]*60;ring.style.strokeDashoffset=755*(1-focusSeconds/total);clock.textContent=String(Math.floor(focusSeconds/60)).padStart(2,'0')+':'+String(focusSeconds%60).padStart(2,'0');const status=$('.clock small');if(status)status.textContent=focusRunning?'IN SESSION':'READY WHEN YOU ARE'}
function setFocusMode(m){focusMode=m;focusRunning=false;clearInterval(focusInterval);focusSeconds=focusModes[m]*60;render()}
function completeFocus(){const t=taskFocus&&state.tasks.find(x=>x.id===taskFocus);state.sessions.unshift({id:'s'+uid(),taskTitle:t?.title||'Deep Focus Sprint',category:t?.category||'deep_work',minutes:focusModes[focusMode],mode:focusMode,date:todayKey()});if(t){t.completed=Math.min(t.estimated,(t.completed||0)+focusModes[focusMode]);if(t.completed>=t.estimated)t.status='completed'}persist();focusRunning=false;clearInterval(focusInterval);focusSeconds=focusModes[focusMode]*60;render();notify('Focus cycle recorded. Great work.')}
function createHabit(){modal(`<div class="modal-head"><div><div class="kicker">CONSISTENCY DESIGN</div><h2>Create a new ritual</h2></div><button class="icon-btn" data-action="close">×</button></div><form id="habitForm"><div class="modal-body"><label class="field"><span>Habit name</span><input name="title" required placeholder="e.g. Morning walk"></label><div class="field-grid"><label class="field"><span>Category</span><select name="category">${Object.entries(cats).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('')}</select></label><label class="field"><span>Target days per week</span><select name="target"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></label><label class="field"><span>Time of day</span><select name="time"><option>morning</option><option>afternoon</option><option>evening</option><option>anytime</option></select></label></div></div><div class="modal-actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="primary" type="submit">Create ritual →</button></div></form>`)}
function exportData(){const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quickplanner-demo-export.json';a.click();URL.revokeObjectURL(a.href);notify('Demo data exported.')}
function copyReport(){const text=`QuickPlanner weekly report\nTasks completed: ${state.tasks.filter(t=>t.status==='completed').length}/${state.tasks.length}\nFocus time: ${(state.sessions.reduce((a,s)=>a+s.minutes,0)/60).toFixed(1)} hours\nRituals today: ${state.habits.filter(h=>h.history[todayKey()]).length}/${state.habits.length}`;navigator.clipboard?.writeText(text).then(()=>notify('Summary copied.')).catch(()=>notify('Clipboard access is unavailable in this browser.'))}
function resetDemo(){if(confirm('Reset QuickPlanner to its original sample tasks, blocks and rituals?')){state=seed();selectedDate=todayKey();persist();render();notify('Demo data restored.')}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action],[data-day]');if(!b)return;const a=b.dataset.action;if(a==='quick-add'){quickAdd()}else if(a==='home'){setTab('timeline')}else if(a==='date-prev'){selectedDate=addDays(selectedDate,-1);render()}else if(a==='date-next'){selectedDate=addDays(selectedDate,1);render()}else if(a==='date-today'){selectedDate=todayKey();render()}else if(a==='auto-schedule'){autoSchedule()}else if(a==='view-day'){viewMode='day';render()}else if(a==='view-week'){viewMode='week';render()}else if(a==='toggle-task'){updateTaskStatus(b.dataset.id)}else if(a==='open-task'){openTask(b.dataset.id)}else if(a==='add-at-time'){if(b.dataset.date)selectedDate=b.dataset.date;quickAdd(b.dataset.addtime)}else if(a==='focus-task'){taskFocus=b.dataset.id;setTab('focus')}else if(a==='toggle-focus'){if(focusRunning){focusRunning=false;clearInterval(focusInterval)}else{focusRunning=true;focusInterval=setInterval(()=>{if(focusSeconds>0){focusSeconds--;updateRing()}else completeFocus()},1000)}render()}else if(a==='reset-focus'){focusRunning=false;clearInterval(focusInterval);focusSeconds=focusModes[focusMode]*60;render()}else if(a==='skip-focus'){completeFocus()}else if(a==='new-habit'){createHabit()}else if(a==='habit-day'){const h=state.habits.find(x=>x.id===b.dataset.id);if(h){h.history[b.dataset.date]=!h.history[b.dataset.date];if(b.dataset.date===todayKey()&&h.history[b.dataset.date])h.streak++;persist();render()}}else if(a==='toggle-habit'){const h=state.habits.find(x=>x.id===b.dataset.id);if(h){h.history[todayKey()]=!h.history[todayKey()];if(h.history[todayKey()])h.streak++;else h.streak=Math.max(0,h.streak-1);persist();render()}}else if(a==='delete-habit'){state.habits=state.habits.filter(h=>h.id!==b.dataset.id);persist();render();notify('Ritual removed.')}else if(a==='copy-report'){copyReport()}else if(a==='export'){exportData()}else if(a==='reset-demo'){resetDemo()}else if(a==='mute'){isMuted=!isMuted;b.textContent=isMuted?'♪':'♫';notify(isMuted?'Audio feedback muted.':'Audio feedback indicator enabled.')}else if(b.dataset.tab){setTab(b.dataset.tab)}else if(b.dataset.day){selectedDate=b.dataset.day;render()}else if(b.dataset.matrix){matrixMode=b.dataset.matrix;render()}else if(b.dataset.mode){setFocusMode(b.dataset.mode)}else if(a==='close'){closeModal()}else if(b.hasAttribute('data-backdrop')&&e.target===b){closeModal()} });
document.addEventListener('submit',e=>{if(e.target.id==='taskForm'){e.preventDefault();addTask(e.target)}else if(e.target.id==='habitForm'){e.preventDefault();const f=new FormData(e.target);state.habits.unshift({id:'h'+uid(),title:f.get('title').trim(),category:f.get('category'),streak:0,target:+f.get('target'),time:f.get('time'),history:{}});persist();closeModal();render();notify('New ritual created.')}});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){searchText=e.target.value;const pos=e.target.selectionStart;const y=window.scrollY;render();const input=$('#taskSearch');input?.focus();input?.setSelectionRange(pos,pos);window.scrollTo(0,y)}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();quickAdd()}else if(!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){if('12345'.includes(e.key))setTab(navItems[+e.key-1][0]);if(e.key==='Escape')closeModal()}});
render();
})();
</script></body></html>
