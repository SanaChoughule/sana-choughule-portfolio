<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PortfolioPilot — a UI prototype for an AI-assisted portfolio CMS for photographers and videographers." />
  <title>PortfolioPilot — Studio CMS Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Plus Jakarta Sans','sans-serif'], editorial: ['Cormorant Garamond','serif'], mono: ['JetBrains Mono','monospace'] },
        colors: { ink:'#171717', paper:'#fbf9f5', line:'#e9e3d9', muted:'#77736c', rust:'#a66d4f', sage:'#738775' },
        boxShadow: { soft:'0 12px 40px rgba(28,25,23,.06)', panel:'0 24px 70px rgba(28,25,23,.16)' }
      }}
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background:#e7e5e4; }
    .scrollbar-none::-webkit-scrollbar { display:none; }
    .scrollbar-none { scrollbar-width:none; }
    .fade-up { animation:fadeUp .28s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(7px) } to { opacity:1; transform:translateY(0) } }
    .photo-hover img { transition:transform .6s cubic-bezier(.2,.7,.2,1); }
    .photo-hover:hover img { transform:scale(1.045); }
    .nav-active { color:#171717; }
    .nav-active:after { content:''; position:absolute; left:0; right:0; bottom:-17px; height:2px; background:#171717; }
    .switch { appearance:none; width:38px; height:22px; background:#d6d3d1; border-radius:99px; position:relative; cursor:pointer; transition:.2s; }
    .switch:checked { background:#292524; }
    .switch:before { content:''; position:absolute; width:16px; height:16px; left:3px; top:3px; border-radius:50%; background:white; transition:.2s; box-shadow:0 1px 3px #0002; }
    .switch:checked:before { transform:translateX(16px); }
    .modal-backdrop { background:rgba(20,18,16,.48); backdrop-filter:blur(5px); }
    input,textarea,select { outline:none; }
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid #9a745e; outline-offset:2px; }
    @media (max-width:640px) { .nav-active:after { bottom:-9px; } }
  </style>
</head>
<body class="min-h-screen text-ink antialiased font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const {useState,useEffect,useMemo} = React;
    const STORE_KEY = 'portfolio_pilot_single_html_v1';
    const photos = {
      fashion:'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=900&q=85',
      cinema:'https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=85',
      architecture:'https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=900&q=85',
      street:'https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=900&q=85',
      portrait:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&q=85',
      coast:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=85'
    };
    const seed = {
      categories:[
        {id:'cat-fashion',name:'Fashion & Editorial',slug:'fashion-editorial',description:'High-concept fashion, lookbooks and sculptural portraiture.',color:'#b78b70'},
        {id:'cat-film',name:'Cinematography & Film',slug:'cinematography-film',description:'Director showreels, narrative shorts and motion-led stills.',color:'#8b887d'},
        {id:'cat-architecture',name:'Brutalist Architecture',slug:'brutalist-architecture',description:'Spatial studies, strong geometry and built environments.',color:'#77877a'},
        {id:'cat-documentary',name:'Documentary & Street',slug:'documentary-street',description:'Observational city stories and environmental portraits.',color:'#788b9b'}
      ],
      items:[
        {id:'item-1',title:'Monolith Silence',description:'A study in sculptural silhouettes, monochrome texture and directional daylight.',categoryId:'cat-fashion',tags:['Editorial','Monochrome','Portrait'],image:photos.fashion,ratio:1.16,published:true,featured:true,source:'Direct upload'},
        {id:'item-2',title:'Anamorphic Horizon',description:'A cinematic frame shaped by warm flare, atmospheric depth and quiet movement.',categoryId:'cat-film',tags:['Cinema','Golden hour','Film'],image:photos.cinema,ratio:1.55,published:true,featured:true,source:'Direct upload'},
        {id:'item-3',title:'Concrete / Quiet Form',description:'Geometric massing and the changing character of natural light.',categoryId:'cat-architecture',tags:['Architecture','Geometry','Light'],image:photos.architecture,ratio:1.22,published:true,featured:false,source:'Direct upload'},
        {id:'item-4',title:'After the Last Train',description:'A nocturnal street study built around reflections, light and human presence.',categoryId:'cat-documentary',tags:['Street','Night','Documentary'],image:photos.street,ratio:1.38,published:true,featured:false,source:'Instagram link'},
        {id:'item-5',title:'Soft Focus Study',description:'An intimate portrait exploring expression, framing and tonal detail.',categoryId:'cat-fashion',tags:['Portrait','Natural light'],image:photos.portrait,ratio:1.18,published:false,featured:false,source:'Direct upload'},
        {id:'item-6',title:'Blue Hour / Coastline',description:'A visual note on coastal atmosphere and the edge of the day.',categoryId:'cat-film',tags:['Coast','Blue hour'],image:photos.coast,ratio:1.48,published:true,featured:false,source:'Direct upload'}
      ],
      jobs:[
        {id:'job-1042',name:'Monolith Silence — master image',source:'Direct upload',status:'Published',time:'Today, 10:42 AM',detail:'Curatorial review approved'},
        {id:'job-1038',name:'After the Last Train — Reel link',source:'Instagram',status:'Review required',time:'Yesterday, 4:18 PM',detail:'Metadata ready for photographer review'},
        {id:'job-1031',name:'Concrete / Quiet Form',source:'Direct upload',status:'Published',time:'Nov 08, 2026',detail:'Category matched to Brutalist Architecture'}
      ],
      settings:{headline:'Alex Vance — Director & Visual Architect',bio:'Photography and moving image exploring architecture, fashion narratives and cinematic atmosphere.',location:'London · Tokyo',template:'Editorial Minimal',grid:'Featured first',autopilot:true,approval:true,metadata:true,compression:true,watermark:false}
    };
    function loadStore(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY)); if(v&&v.items&&v.categories)return v;}catch(e){} return seed;}
    const fmt = n => String(n).padStart(2,'0');
    function Icon({name,size=16,className=''}){return <i data-lucide={name} className={className} style={{width:size,height:size,display:'inline-block'}}/>}
    function App(){
      const [data,setData] = useState(loadStore);
      const [tab,setTab] = useState('overview');
      const [publicView,setPublicView] = useState(false);
      const [uploadOpen,setUploadOpen] = useState(false);
      const [review,setReview] = useState(null);
      const [processing,setProcessing] = useState(null);
      const [toast,setToast] = useState('');
      const [search,setSearch] = useState('');
      const [catFilter,setCatFilter] = useState('all');
      const [publicCat,setPublicCat] = useState('all');
      const [activeLightbox,setActiveLightbox] = useState(null);
      const [editCategory,setEditCategory] = useState(null);
      const [newCategory,setNewCategory] = useState(false);
      const [newCatName,setNewCatName] = useState('');
      const [newCatDesc,setNewCatDesc] = useState('');
      const [gridMode,setGridMode] = useState('Featured first');
      const [uploadType,setUploadType] = useState('upload');
      const [filePreview,setFilePreview] = useState('');
      const [fileName,setFileName] = useState('');
      const [instaUrl,setInstaUrl] = useState('');
      const [uploadError,setUploadError] = useState('');
      const [reviewFields,setReviewFields] = useState(null);
      const [mobileMenu,setMobileMenu] = useState(false);

      useEffect(()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){}},[data]);
      useEffect(()=>{if(window.lucide)window.lucide.createIcons();});
      useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(t);},[toast]);

      const published = data.items.filter(x=>x.published);
      const featured = data.items.filter(x=>x.featured);
      const drafts = data.items.filter(x=>!x.published);
      const filteredItems = useMemo(()=>data.items.filter(x=>{
        const matchCat=catFilter==='all'||x.categoryId===catFilter;
        const q=search.toLowerCase();
        const matchText=!q||x.title.toLowerCase().includes(q)||x.description.toLowerCase().includes(q)||x.tags.join(' ').toLowerCase().includes(q);
        return matchCat&&matchText;
      }).sort((a,b)=>gridMode==='Featured first'?(Number(b.featured)-Number(a.featured)):gridMode==='Newest first'?b.id.localeCompare(a.id):0),[data.items,catFilter,search,gridMode]);

      function notify(m){setToast(m);}
      function updateSettings(k,v){setData(d=>({...d,settings:{...d.settings,[k]:v}}));}
      function startProcessing(payload){
        setUploadOpen(false); setUploadError('');
        const job={id:'job-'+Date.now(),name:payload.title||payload.name||'New creative work',source:payload.source||'Direct upload',status:'Processing',time:'Just now',detail:'Demo pipeline running'};
        setProcessing({job,step:0,payload});
        let s=0;
        const timer=setInterval(()=>{s++;setProcessing(p=>p?({...p,step:s}):p);if(s>=5){clearInterval(timer);const category=data.categories[0];const draft={id:'item-'+Date.now(),title:payload.title||'New Creative Study',description:'A curated visual study. Refine this statement and confirm the category before publishing.',categoryId:category.id,tags:['New work','Curated','Portfolio'],image:payload.image||photos.portrait,ratio:1.25,published:false,featured:false,source:payload.source||'Direct upload'};setData(d=>({...d,items:[draft,...d.items],jobs:[{...job,status:'Review required',detail:'Demo processing complete · awaiting your review'},...d.jobs]}));setProcessing(null);setReview(draft);setReviewFields({...draft});notify('Demo processing complete — review the suggested details.');}},560);
      }
      function handleFile(file){if(!file)return; if(!file.type.startsWith('image/')){setUploadError('For this UI demo, choose an image file (JPG, PNG or WebP).');return;} if(file.size>3*1024*1024){setUploadError('Please choose an image under 3 MB for browser storage.');return;} const reader=new FileReader();reader.onload=()=>{setFilePreview(reader.result);setFileName(file.name);setUploadError('');};reader.readAsDataURL(file);}
      function submitUpload(){
        if(uploadType==='upload'){
          if(!filePreview){setUploadError('Choose an image first, or try one of the sample files.');return;}
          startProcessing({title:fileName.replace(/\.[^.]+$/,''),name:fileName,source:'Direct upload',image:filePreview});
        } else {
          const m=instaUrl.match(/instagram\.com\/(?:reel|reels|p)\/([A-Za-z0-9_-]+)/i);
          if(!m){setUploadError('Enter a valid Instagram post or Reel URL format. This demo only checks the URL pattern.');return;}
          startProcessing({title:'Instagram import · '+m[1],source:'Instagram URL',image:photos.cinema});
        }
      }
      function approveReview(){if(!reviewFields)return;setData(d=>({...d,items:d.items.map(x=>x.id===reviewFields.id?{...reviewFields,published:true}:x),jobs:[{id:'job-'+Date.now(),name:reviewFields.title,source:reviewFields.source,status:'Published',time:'Just now',detail:'Approved in demo review'},...d.jobs]}));setReview(null);setReviewFields(null);notify('Work published to the demo public portfolio.');}
      function removeItem(id){setData(d=>({...d,items:d.items.filter(x=>x.id!==id)}));notify('Portfolio item removed.');}
      function toggleItem(id,key){setData(d=>({...d,items:d.items.map(x=>x.id===id?{...x,[key]:!x[key]}:x)}));}
      function saveCategory(){if(!newCatName.trim())return;const c={id:'cat-'+Date.now(),name:newCatName.trim(),slug:newCatName.toLowerCase().replace(/[^a-z0-9]+/g,'-'),description:newCatDesc.trim()||'A photographer-defined collection.',color:'#9a826d'};setData(d=>({...d,categories:[...d.categories,c]}));setNewCatName('');setNewCatDesc('');setNewCategory(false);notify('Category added.');}
      function resetDemo(){if(confirm('Reset this browser demo to its original sample data?')){localStorage.removeItem(STORE_KEY);setData(seed);setTab('overview');setPublicView(false);notify('Demo data reset.');}}

      const nav=[['overview','LayoutDashboard','Overview'],['portfolio','Images','Portfolio'],['categories','Folders','Categories'],['activity','Activity','AI Activity'],['website','Globe','Website'],['settings','Settings','Settings']];
      const titleMap={overview:['Studio CMS Engine','Curatorial Overview','A clear view of your creative library, its taxonomy and publishing status.'],portfolio:['Curated Works','Portfolio Management','Organize visual sequence, refine metadata and control public visibility.'],categories:['Classification System','Category Management','Create and maintain the collections that shape a photographer’s portfolio.'],activity:['Processing History','AI Activity','Review the proposed ingestion workflow and its current demo states.'],website:['Public Experience','Website Builder','Shape the presentation layer of the public portfolio.'],settings:['Workspace Controls','Studio Settings','Manage the preferences that guide the proposed curation workflow.']};

      return <div className="min-h-screen flex flex-col items-center md:py-5 md:px-4">
        <div className="w-full max-w-[1440px] min-h-screen md:min-h-[900px] bg-paper md:rounded-2xl shadow-panel overflow-hidden relative">
          <header className="sticky top-0 z-30 bg-paper/95 backdrop-blur-xl border-b border-line">
            <div className="max-w-7xl mx-auto px-4 sm:px-7 h-[70px] flex items-center justify-between gap-5">
              <button onClick={()=>{setPublicView(false);setTab('overview');}} className="text-left flex items-center gap-3 shrink-0">
                <div className="w-9 h-9 rounded-lg bg-ink text-white flex items-center justify-center"><Icon name="aperture" size={19}/></div>
                <div><div className="font-editorial text-[25px] leading-none font-semibold tracking-tight">PortfolioPilot</div><div className="font-mono text-[9px] text-stone-500 tracking-[.2em] uppercase mt-1">Studio CMS</div></div>
              </button>
              {!publicView&&<nav className="hidden lg:flex items-center gap-6 text-[12px] font-medium text-stone-500">{nav.map(([id,ic,label])=><button key={id} onClick={()=>setTab(id)} className={`relative py-2 transition-colors hover:text-ink ${tab===id?'nav-active font-semibold':''}`}>{label}</button>)}</nav>}
              <div className="flex items-center gap-2 sm:gap-3">
                <span className="hidden xl:inline-flex items-center gap-1.5 text-[10px] text-stone-500 font-mono uppercase tracking-wider"><span className="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Demo workspace</span>
                <button onClick={()=>setPublicView(v=>!v)} className="hidden sm:inline-flex items-center gap-2 px-3 py-2 text-[11px] font-semibold border border-line rounded-lg hover:bg-white"><Icon name={publicView?'layout-dashboard':'globe'} size={14}/>{publicView?'Studio CMS':'Public Site'}</button>
                {!publicView&&<button onClick={()=>{setUploadType('upload');setFilePreview('');setFileName('');setInstaUrl('');setUploadOpen(true);}} className="inline-flex items-center gap-2 px-3.5 py-2.5 text-[11px] font-semibold bg-ink text-white rounded-lg hover:bg-stone-700"><Icon name="plus" size={14}/> <span className="hidden sm:inline">Add New Work</span><span className="sm:hidden">Add</span></button>}
                <button className="lg:hidden p-2 rounded-lg border border-line" onClick={()=>setMobileMenu(m=>!m)}><Icon name="menu"/></button>
              </div>
            </div>
            {!publicView&&<div className="lg:hidden border-t border-line px-4 py-2.5 flex gap-5 overflow-x-auto scrollbar-none">{nav.map(([id,ic,label])=><button key={id} onClick={()=>{setTab(id);setMobileMenu(false);}} className={`whitespace-nowrap text-[11px] ${tab===id?'font-bold text-ink':'text-stone-500'}`}>{label}</button>)}</div>}
          </header>

          {publicView?<PublicSite items={published} categories={data.categories} settings={data.settings} onBack={()=>setPublicView(false)} onOpen={setActiveLightbox} publicCat={publicCat} setPublicCat={setPublicCat}/>:<>
            <div className="max-w-7xl mx-auto px-4 sm:px-7 pt-8 sm:pt-10 pb-14">
              <div className="mb-7 flex flex-col md:flex-row md:items-end justify-between gap-4 border-b border-line pb-6">
                <div><div className="font-mono text-[10px] uppercase tracking-[.2em] text-stone-500">{titleMap[tab][0]}</div><h1 className="font-editorial text-[42px] sm:text-[52px] leading-[1.02] font-normal mt-1">{titleMap[tab][1]}</h1><p className="text-[12px] sm:text-[13px] text-stone-500 mt-2 max-w-2xl leading-relaxed">{titleMap[tab][2]}</p></div>
                <div className="flex items-center gap-2"><span className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md bg-amber-50 border border-amber-200 text-[9px] font-mono uppercase tracking-wider text-amber-800"><Icon name="flask-conical" size={12}/> UI prototype · simulated flows</span>{tab==='overview'&&<button onClick={()=>setPublicView(true)} className="px-3 py-2 bg-white border border-line rounded-lg text-[11px] font-semibold hover:bg-stone-50">Preview site <Icon name="arrow-up-right" size={12}/></button>}</div>
              </div>
              {tab==='overview'&&<Overview data={data} published={published} drafts={drafts} featured={featured} setTab={setTab} setPublicView={setPublicView} setReview={setReview} setReviewFields={setReviewFields} setUploadOpen={setUploadOpen} onToggleAutopilot={()=>updateSettings('autopilot',!data.settings.autopilot)}/>}
              {tab==='portfolio'&&<Portfolio items={filteredItems} categories={data.categories} search={search} setSearch={setSearch} catFilter={catFilter} setCatFilter={setCatFilter} gridMode={gridMode} setGridMode={setGridMode} onToggle={toggleItem} onRemove={removeItem} onOpen={setActiveLightbox} onUpload={()=>setUploadOpen(true)}/>}
              {tab==='categories'&&<Categories categories={data.categories} items={data.items} onAdd={()=>setNewCategory(true)} onEdit={setEditCategory} />}
              {tab==='activity'&&<Activity jobs={data.jobs} onReview={()=>{const draft=drafts[0];if(draft){setReview(draft);setReviewFields({...draft});}else notify('No review items in this demo queue.')}}/>}
              {tab==='website'&&<WebsiteBuilder settings={data.settings} update={updateSettings} published={published} categories={data.categories} onPreview={()=>setPublicView(true)}/>}
              {tab==='settings'&&<Settings settings={data.settings} update={updateSettings} reset={resetDemo}/>}
            </div>
          </>}
          <footer className="border-t border-line px-5 sm:px-7 py-5 flex flex-col sm:flex-row justify-between gap-2 text-[10px] text-stone-400"><span>PORTFOLIOPILOT · STUDIO CMS CONCEPT</span><span>Single-file UI prototype · Data stays in this browser</span></footer>
        </div>
        {toast&&<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[90] px-4 py-3 bg-stone-900 text-white rounded-xl shadow-panel text-xs flex items-center gap-2 fade-up"><Icon name="check-circle-2" size={15}/>{toast}</div>}
        {uploadOpen&&<UploadModal uploadType={uploadType} setUploadType={setUploadType} filePreview={filePreview} fileName={fileName} handleFile={handleFile} instaUrl={instaUrl} setInstaUrl={setInstaUrl} error={uploadError} onClose={()=>setUploadOpen(false)} onSubmit={submitUpload} onSample={(p)=>{setUploadType('upload');setFilePreview(p.image);setFileName(p.name);setUploadError('');}}/>}
        {processing&&<ProcessingModal processing={processing}/>}
        {review&&reviewFields&&<ReviewDrawer item={review} fields={reviewFields} setFields={setReviewFields} categories={data.categories} onClose={()=>{setReview(null);setReviewFields(null);}} onApprove={approveReview} onReject={()=>{removeItem(review.id);setReview(null);setReviewFields(null);notify('Draft rejected and removed.');}}/>}
        {activeLightbox&&<Lightbox item={activeLightbox} category={data.categories.find(c=>c.id===activeLightbox.categoryId)} onClose={()=>setActiveLightbox(null)}/>}
        {editCategory&&<CategoryEditor category={editCategory} onClose={()=>setEditCategory(null)} onSave={(updated)=>{setData(d=>({...d,categories:d.categories.map(c=>c.id===updated.id?updated:c)}));setEditCategory(null);notify('Category updated.');}}/>}
        {newCategory&&<div className="fixed inset-0 z-[80] modal-backdrop flex items-center justify-center p-4"><div className="bg-paper rounded-2xl shadow-panel w-full max-w-md p-6"><div className="flex justify-between"><div><div className="font-mono text-[10px] uppercase tracking-widest text-stone-500">New taxonomy</div><h3 className="font-editorial text-3xl">Add category</h3></div><button onClick={()=>setNewCategory(false)}><Icon name="x"/></button></div><label className="block text-[10px] uppercase tracking-wider text-stone-500 mt-6 mb-1">Category name</label><input value={newCatName} onChange={e=>setNewCatName(e.target.value)} className="w-full bg-white border border-line rounded-lg px-3 py-2.5 text-sm" placeholder="e.g. Travel & Landscape"/><label className="block text-[10px] uppercase tracking-wider text-stone-500 mt-4 mb-1">Description</label><textarea value={newCatDesc} onChange={e=>setNewCatDesc(e.target.value)} className="w-full bg-white border border-line rounded-lg px-3 py-2.5 text-sm" rows="3" placeholder="What belongs in this collection?"/><button onClick={saveCategory} className="w-full mt-5 bg-ink text-white py-3 rounded-lg text-xs font-semibold">Create category</button></div></div>}
      </div>;
    }

    function Stat({label,value,meta,icon}){return <div className="p-5 bg-white border border-line rounded-xl shadow-soft"><div className="flex items-center justify-between"><span className="text-[11px] text-stone-500">{label}</span><span className="w-8 h-8 rounded-lg bg-stone-100 flex items-center justify-center text-stone-500"><Icon name={icon} size={15}/></span></div><div className="font-editorial text-4xl mt-3 leading-none">{value}</div><div className="text-[10px] text-stone-400 mt-2">{meta}</div></div>}

    function Overview({data,published,drafts,featured,setTab,setPublicView,setReview,setReviewFields,setUploadOpen,onToggleAutopilot}){
      const recent=data.items.slice(0,4);
      return <div className="space-y-9 fade-up">
        <section className="grid grid-cols-2 xl:grid-cols-4 gap-3 sm:gap-4"><Stat label="Total portfolio works" value={data.items.length} meta={`${published.length} published · ${drafts.length} drafts`} icon="images"/><Stat label="Active taxonomies" value={data.categories.length} meta="Photographer-defined collections" icon="layers"/><Stat label="Featured spotlights" value={featured.length} meta="Priority in public grid" icon="star"/><div className="p-5 bg-ink text-white rounded-xl shadow-soft"><div className="flex justify-between items-center"><span className="text-[11px] text-stone-400">Autopilot engine</span><Icon name="sparkles" size={16} className="text-stone-300"/></div><div className="font-editorial text-3xl mt-3">{data.settings.autopilot?'Autonomous':'Manual'}</div><div className="flex justify-between items-center mt-3"><span className="text-[10px] text-stone-400">{data.settings.approval?'Approval required':'Auto-publish'}</span><button onClick={onToggleAutopilot} className="text-[10px] underline text-stone-300">Toggle</button></div></div></section>
        <section className="grid grid-cols-1 xl:grid-cols-[1.65fr_1fr] gap-6">
          <div className="space-y-4"><div className="flex items-center justify-between"><div><div className="font-mono text-[9px] uppercase tracking-[.18em] text-stone-400">Creative library</div><h2 className="font-editorial text-3xl">Recent portfolio works</h2></div><button onClick={()=>setTab('portfolio')} className="text-[11px] font-semibold text-stone-500 hover:text-ink">View all <Icon name="arrow-right" size={13}/></button></div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">{recent.map(item=><WorkCard key={item.id} item={item} category={data.categories.find(c=>c.id===item.categoryId)} onOpen={()=>{}} compact/>)}</div>
          </div>
          <div className="space-y-5"><div className="bg-white border border-line rounded-xl p-5"><div className="flex items-center justify-between"><h3 className="font-editorial text-2xl">Ingestion queue</h3><span className="font-mono text-[9px] uppercase text-stone-400">Recent</span></div><div className="mt-4 space-y-4">{data.jobs.slice(0,3).map((j,i)=><div key={j.id} className="flex gap-3"><div className={`w-8 h-8 shrink-0 rounded-full flex items-center justify-center ${j.status==='Published'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}`}><Icon name={j.status==='Published'?'check':'clock'} size={14}/></div><div className="min-w-0 flex-1"><div className="text-[11px] font-semibold truncate">{j.name}</div><div className="text-[10px] text-stone-400 mt-1">{j.source} · {j.time}</div><div className="text-[10px] mt-1 text-stone-500">{j.status}</div></div></div>)}</div><button onClick={()=>setTab('activity')} className="mt-5 pt-3 border-t border-line w-full text-left text-[10px] font-semibold text-stone-500">View activity history <Icon name="arrow-right" size={12}/></button></div>
            <div className="bg-[#f1eee8] border border-[#e5ded3] rounded-xl p-5"><div className="flex gap-2 items-center"><Icon name="lightbulb" size={15}/><span className="font-mono text-[9px] uppercase tracking-widest text-stone-500">Prototype note</span></div><p className="font-editorial text-2xl mt-3 leading-tight">Human taste stays in the loop.</p><p className="text-[11px] text-stone-600 mt-2 leading-relaxed">The proposed workflow gives AI a first pass at metadata and category suggestions, while the photographer retains control over the final selection and publishing decision.</p></div>
          </div>
        </section>
      </div>;
    }

    function WorkCard({item,category,onOpen,compact=false,onToggle,onRemove}){return <article className="bg-white border border-line rounded-xl overflow-hidden group"><button onClick={onOpen} className="block w-full text-left photo-hover relative bg-stone-200 overflow-hidden" style={{height:compact?175:225}}><img src={item.image} alt={item.title} className="w-full h-full object-cover"/><span className="absolute top-3 left-3 px-2 py-1 bg-white/90 backdrop-blur rounded text-[9px] font-mono uppercase tracking-wider">{item.published?'Published':'Draft'}</span>{item.featured&&<span className="absolute top-3 right-3 px-2 py-1 bg-amber-200/95 text-amber-950 rounded text-[9px] font-semibold">Featured</span>}</button><div className="p-4"><div className="text-[9px] font-mono text-stone-400 uppercase tracking-wider">{category?.name||'Uncategorised'}</div><h3 className="font-editorial text-[23px] leading-tight mt-1">{item.title}</h3><p className="text-[10px] text-stone-500 leading-relaxed mt-1.5 line-clamp-2">{item.description}</p>{!compact&&<div className="flex flex-wrap gap-1.5 mt-3">{item.tags.map(t=><span key={t} className="text-[9px] px-2 py-1 rounded-full bg-stone-100 text-stone-600">#{t}</span>)}</div>}{!compact&&<div className="flex items-center justify-between mt-4 pt-3 border-t border-line"><button onClick={()=>onToggle&&onToggle(item.id,'published')} className="text-[10px] text-stone-600 underline">{item.published?'Unpublish':'Publish'}</button><div className="flex gap-2"><button onClick={()=>onToggle&&onToggle(item.id,'featured')} className="p-1.5 rounded hover:bg-stone-100" title="Toggle featured"><Icon name="star" size={14}/></button><button onClick={()=>onRemove&&onRemove(item.id)} className="p-1.5 rounded hover:bg-red-50 text-stone-400 hover:text-red-600" title="Remove"><Icon name="trash-2" size={14}/></button></div></div>}</div></article>}

    function Portfolio({items,categories,search,setSearch,catFilter,setCatFilter,gridMode,setGridMode,onToggle,onRemove,onOpen,onUpload}){
      return <div className="space-y-5 fade-up"><div className="bg-white border border-line rounded-xl p-4 flex flex-col lg:flex-row gap-3 lg:items-center justify-between"><div className="flex gap-1.5 flex-wrap"><button onClick={()=>setCatFilter('all')} className={`px-3 py-2 rounded-lg text-[10px] ${catFilter==='all'?'bg-ink text-white':'bg-stone-100 text-stone-600'}`}>All works</button>{categories.map(c=><button key={c.id} onClick={()=>setCatFilter(c.id)} className={`px-3 py-2 rounded-lg text-[10px] ${catFilter===c.id?'bg-ink text-white':'bg-stone-100 text-stone-600'}`}>{c.name}</button>)}</div><div className="flex gap-2"><input value={search} onChange={e=>setSearch(e.target.value)} className="min-w-0 w-full lg:w-52 px-3 py-2 border border-line rounded-lg text-[11px]" placeholder="Search title or tags…"/><select value={gridMode} onChange={e=>setGridMode(e.target.value)} className="px-3 py-2 border border-line rounded-lg text-[10px] bg-white"><option>Featured first</option><option>Newest first</option><option>Manual order</option></select><button onClick={onUpload} className="px-3 py-2 bg-ink text-white rounded-lg text-[10px] whitespace-nowrap">+ Add work</button></div></div><div className="flex justify-between items-center"><span className="text-[10px] text-stone-400">{items.length} works shown</span><span className="text-[10px] text-stone-400">Changes are saved in this browser</span></div>{items.length?<div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">{items.map(x=><WorkCard key={x.id} item={x} category={categories.find(c=>c.id===x.categoryId)} onOpen={()=>onOpen(x)} onToggle={onToggle} onRemove={onRemove}/>)}</div>:<div className="text-center py-20 text-sm text-stone-400">No portfolio works match these filters.</div>}</div>
    }

    function Categories({categories,items,onAdd,onEdit}){return <div className="space-y-5 fade-up"><div className="flex justify-between items-center"><p className="text-[11px] text-stone-500">Categories define how work is grouped and presented on the public portfolio.</p><button onClick={onAdd} className="px-4 py-2.5 bg-ink text-white rounded-lg text-[11px] font-semibold">+ New category</button></div><div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">{categories.map(c=>{const count=items.filter(x=>x.categoryId===c.id).length;return <div key={c.id} className="bg-white border border-line rounded-xl p-5"><div className="flex justify-between items-start"><span className="w-9 h-9 rounded-lg" style={{background:c.color||'#ddd'}}></span><span className="text-[9px] font-mono uppercase text-stone-400">{count} works</span></div><h3 className="font-editorial text-[26px] mt-5">{c.name}</h3><p className="text-[11px] text-stone-500 mt-2 leading-relaxed min-h-[42px]">{c.description}</p><div className="border-t border-line mt-5 pt-3 flex justify-between items-center"><span className="font-mono text-[9px] text-stone-400">/{c.slug}</span><button onClick={()=>onEdit(c)} className="text-[10px] font-semibold underline">Edit category</button></div></div>})}</div></div>}

    function Activity({jobs,onReview}){return <div className="grid lg:grid-cols-[1.4fr_1fr] gap-5 fade-up"><div className="bg-white border border-line rounded-xl p-5"><div className="flex justify-between items-center"><h2 className="font-editorial text-3xl">Processing history</h2><span className="px-2 py-1 bg-amber-50 text-amber-800 border border-amber-200 rounded text-[9px] font-mono">SIMULATED DATA</span></div><div className="mt-6 space-y-0">{jobs.map((j,i)=><div key={j.id} className="flex gap-4 py-4 border-t border-line"><div className="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center shrink-0"><Icon name={j.status==='Published'?'check':'clock'} size={15}/></div><div className="flex-1 min-w-0"><div className="flex flex-col sm:flex-row sm:justify-between gap-1"><b className="text-[12px]">{j.name}</b><span className={`text-[9px] uppercase font-mono ${j.status==='Published'?'text-emerald-700':'text-amber-700'}`}>{j.status}</span></div><div className="text-[10px] text-stone-400 mt-1">{j.source} · {j.time}</div><div className="text-[11px] text-stone-600 mt-2">{j.detail}</div></div></div>)}</div></div><div className="bg-[#f0ede7] border border-[#e4ddd3] rounded-xl p-5 h-fit"><Icon name="workflow" size={19}/><h3 className="font-editorial text-3xl mt-3">Proposed ingestion flow</h3><div className="mt-5 space-y-3">{['Media received','Format & integrity checks','Visual review / metadata suggestion','Category & placement suggestion','Photographer approval','Portfolio publish'].map((x,i)=><div className="flex items-center gap-3" key={x}><span className="w-6 h-6 rounded-full bg-white border border-stone-300 flex items-center justify-center font-mono text-[9px]">{fmt(i+1)}</span><span className="text-[11px] text-stone-700">{x}</span></div>)}</div><p className="text-[10px] text-stone-500 mt-5 leading-relaxed">This prototype illustrates the proposed workflow. It does not run a background processing queue or connect to a production media pipeline.</p><button onClick={onReview} className="mt-5 px-4 py-2.5 bg-ink text-white rounded-lg text-[10px]">Open demo review</button></div></div>}

    function WebsiteBuilder({settings,update,published,categories,onPreview}){return <div className="grid xl:grid-cols-[.9fr_1.1fr] gap-5 fade-up"><div className="bg-white border border-line rounded-xl p-5 space-y-5"><div><h2 className="font-editorial text-3xl">Portfolio identity</h2><p className="text-[10px] text-stone-400 mt-1">Presentation settings for the public-facing site.</p></div><Field label="Headline"><input value={settings.headline} onChange={e=>update('headline',e.target.value)} className="form-input"/></Field><Field label="Biography"><textarea rows="3" value={settings.bio} onChange={e=>update('bio',e.target.value)} className="form-input"/></Field><Field label="Location"><input value={settings.location} onChange={e=>update('location',e.target.value)} className="form-input"/></Field><Field label="Visual template"><select value={settings.template} onChange={e=>update('template',e.target.value)} className="form-input"><option>Editorial Minimal</option><option>Monochrome Brutalist</option><option>Warm Cinematic</option></select></Field><Field label="Grid order"><select value={settings.grid} onChange={e=>update('grid',e.target.value)} className="form-input"><option>Featured first</option><option>Newest first</option><option>Manual order</option></select></Field><button onClick={onPreview} className="w-full bg-ink text-white rounded-lg py-3 text-[11px] font-semibold">Preview public site <Icon name="arrow-up-right" size={13}/></button></div><div className="bg-stone-200/70 rounded-xl p-4 sm:p-7"><div className="flex justify-between items-center text-[9px] font-mono uppercase text-stone-500 mb-3"><span>Live preview · illustrative</span><span>Desktop</span></div><div className="bg-[#fbf9f5] min-h-[500px] p-5 sm:p-8 shadow-soft"><div className="flex justify-between text-[9px] uppercase tracking-widest text-stone-400 border-b border-stone-200 pb-3"><span>{settings.location||'Your location'}</span><span>Selected works</span></div><h2 className="font-editorial text-4xl sm:text-5xl mt-10 leading-[.98] max-w-lg">{settings.headline}</h2><p className="text-[11px] text-stone-500 mt-4 max-w-md leading-relaxed">{settings.bio}</p><div className="grid grid-cols-2 gap-3 mt-9">{published.slice(0,4).map(x=><div key={x.id}><img src={x.image} className="w-full h-28 sm:h-36 object-cover"/><div className="font-editorial text-lg mt-1">{x.title}</div></div>)}</div><div className="text-[8px] text-stone-400 tracking-widest uppercase mt-9 border-t border-stone-200 pt-4">Published with PortfolioPilot · Demo preview</div></div></div></div>}

    function Field({label,children}){return <label className="block"><span className="block text-[9px] uppercase tracking-widest text-stone-500 mb-1.5">{label}</span>{React.cloneElement(children,{className:(children.props.className||'')+' w-full px-3 py-2.5 bg-[#fcfbf8] border border-line rounded-lg text-[11px] text-stone-800'})}</label>}
    function Settings({settings,update,reset}){const rows=[['autopilot','Autopilot enabled','Allow the proposed workflow to prepare curation suggestions.'],['approval','Photographer approval required','Keep a human review step before an item is published.'],['metadata','AI metadata suggestions','Proposed titles, descriptions and tags for review.'],['compression','Smart image optimisation','A planned publishing preference; no image processing runs here.'],['watermark','Watermark on public images','A presentation preference for a future publishing workflow.']];return <div className="grid lg:grid-cols-[1.3fr_1fr] gap-5 fade-up"><div className="bg-white border border-line rounded-xl p-5"><h2 className="font-editorial text-3xl">Workflow preferences</h2><div className="mt-4">{rows.map(([key,title,desc])=><div key={key} className="py-4 border-t border-line flex justify-between items-center gap-4"><div><div className="text-[12px] font-semibold">{title}</div><p className="text-[10px] text-stone-500 mt-1 max-w-lg">{desc}</p></div><input type="checkbox" checked={!!settings[key]} onChange={e=>update(key,e.target.checked)} className="switch shrink-0"/></div>)}</div></div><div className="space-y-4"><div className="bg-[#f0ede7] border border-[#e4ddd3] rounded-xl p-5"><Icon name="shield-check" size={20}/><h3 className="font-editorial text-2xl mt-3">Prototype boundaries</h3><p className="text-[11px] text-stone-600 mt-2 leading-relaxed">This is a front-end demonstration. It stores editable sample data in this browser only. It does not connect to Gemini, download Instagram media, upload files to cloud storage or publish a remotely hosted creator site.</p></div><button onClick={reset} className="w-full px-4 py-3 rounded-lg border border-line bg-white text-[11px] font-semibold hover:bg-stone-50">Reset demo data</button></div></div>}

    function UploadModal({uploadType,setUploadType,filePreview,fileName,handleFile,instaUrl,setInstaUrl,error,onClose,onSubmit,onSample}){return <div className="fixed inset-0 z-[70] modal-backdrop flex items-center justify-center p-4"><div className="w-full max-w-xl bg-paper rounded-2xl shadow-panel overflow-hidden max-h-[92vh] flex flex-col fade-up"><div className="p-5 sm:p-6 border-b border-line flex justify-between"><div><div className="font-mono text-[9px] uppercase tracking-widest text-stone-500">Media ingestion · Demo</div><h2 className="font-editorial text-3xl">Add new work</h2><p className="text-[10px] text-stone-500 mt-1">Try the UI workflow with a local image or sample asset.</p></div><button onClick={onClose} className="p-2 h-fit rounded-lg hover:bg-stone-100"><Icon name="x"/></button></div><div className="p-5 sm:p-6 overflow-y-auto"><div className="grid grid-cols-2 p-1 bg-stone-100 rounded-lg"><button onClick={()=>setUploadType('upload')} className={`py-2 rounded-md text-[11px] ${uploadType==='upload'?'bg-white shadow-sm font-semibold':'text-stone-500'}`}>Direct upload</button><button onClick={()=>setUploadType('instagram')} className={`py-2 rounded-md text-[11px] ${uploadType==='instagram'?'bg-white shadow-sm font-semibold':'text-stone-500'}`}>Instagram URL</button></div>{uploadType==='upload'?<><label className="mt-5 border-2 border-dashed border-stone-300 bg-white rounded-xl p-7 flex flex-col items-center text-center cursor-pointer hover:border-stone-500"><input type="file" accept="image/*" className="hidden" onChange={e=>handleFile(e.target.files[0])}/>{filePreview?<img src={filePreview} className="w-24 h-24 object-cover rounded-lg mb-3"/>:<span className="w-11 h-11 rounded-full bg-stone-100 flex items-center justify-center mb-3"><Icon name="upload-cloud" size={20}/></span>}<b className="text-[12px]">{fileName||'Choose an image to preview'}</b><span className="text-[10px] text-stone-400 mt-1">JPG, PNG or WebP · up to 3 MB in this demo</span></label><div className="mt-4"><div className="text-[9px] uppercase tracking-widest text-stone-500 mb-2">Or use sample media</div><div className="grid grid-cols-3 gap-2">{[{name:'Fashion editorial',image:photos.fashion},{name:'Cinema still',image:photos.cinema},{name:'Architecture',image:photos.architecture}].map(p=><button key={p.name} onClick={()=>onSample(p)} className={`text-left bg-white border border-line rounded-lg overflow-hidden ${filePreview===p.image?'ring-2 ring-stone-800':''}`}><img src={p.image} className="w-full h-16 object-cover"/><span className="block p-2 text-[9px]">{p.name}</span></button>)}</div></div></>:<div className="mt-5"><label className="block text-[9px] uppercase tracking-widest text-stone-500 mb-2">Instagram post or Reel URL</label><input value={instaUrl} onChange={e=>setInstaUrl(e.target.value)} className="w-full px-3 py-3 bg-white border border-line rounded-lg text-[11px]" placeholder="https://www.instagram.com/reel/…"/><p className="text-[10px] text-stone-400 mt-2">Demo only: this checks the link pattern. It does not retrieve Instagram content.</p></div>}{error&&<p className="mt-3 text-[10px] text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{error}</p>}<div className="mt-5 p-3 bg-amber-50 border border-amber-200 rounded-lg text-[10px] text-amber-900 flex gap-2"><Icon name="info" size={14} className="shrink-0"/>The next steps are simulated locally. No file is uploaded to a server and no AI API is called.</div></div><div className="p-5 border-t border-line flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2.5 rounded-lg text-[11px] border border-line">Cancel</button><button onClick={onSubmit} className="px-5 py-2.5 rounded-lg bg-ink text-white text-[11px] font-semibold">Start demo curation <Icon name="arrow-right" size={13}/></button></div></div></div>}

    function ProcessingModal({processing}){const steps=['Validating media format','Preparing preview','Generating metadata suggestion','Matching category','Preparing review'];return <div className="fixed inset-0 z-[75] modal-backdrop flex items-center justify-center p-4"><div className="bg-paper w-full max-w-md rounded-2xl shadow-panel p-6 fade-up"><div className="flex items-center gap-3"><div className="w-10 h-10 bg-ink text-white rounded-xl flex items-center justify-center"><Icon name="sparkles" size={18}/></div><div><div className="font-mono text-[9px] uppercase tracking-widest text-stone-500">Prototype workflow</div><h3 className="font-editorial text-2xl">Preparing your work</h3></div></div><div className="mt-5 h-1.5 bg-stone-200 rounded-full overflow-hidden"><div className="h-full bg-ink transition-all" style={{width:((processing.step+1)/5*100)+'%'}}/></div><div className="text-right font-mono text-[9px] text-stone-400 mt-1">{Math.min(100,(processing.step+1)*20)}%</div><div className="mt-4 space-y-3">{steps.map((s,i)=><div className="flex items-center gap-3 text-[11px]" key={s}><span className={`w-5 h-5 rounded-full flex items-center justify-center ${i<=processing.step?'bg-emerald-100 text-emerald-700':'bg-stone-100 text-stone-400'}`}><Icon name={i<=processing.step?'check':'circle'} size={11}/></span><span className={i<=processing.step?'text-stone-800':'text-stone-400'}>{s}</span></div>)}</div><p className="text-[10px] text-stone-400 mt-5">Visual simulation only — not an actual background AI process.</p></div></div>}

    function ReviewDrawer({item,fields,setFields,categories,onClose,onApprove,onReject}){const update=(k,v)=>setFields(f=>({...f,[k]:v}));return <div className="fixed inset-0 z-[80] modal-backdrop flex justify-end"><div className="bg-paper w-full max-w-2xl h-full overflow-y-auto shadow-panel fade-up"><div className="p-5 sm:p-7 border-b border-line flex justify-between items-center"><div><div className="font-mono text-[9px] uppercase tracking-widest text-stone-500">Curatorial verification · Demo</div><h2 className="font-editorial text-3xl">Review & placement</h2></div><button onClick={onClose} className="p-2 hover:bg-stone-100 rounded-lg"><Icon name="x"/></button></div><div className="p-5 sm:p-7 space-y-5"><img src={fields.image} className="w-full h-52 object-cover rounded-xl"/><Field label="Curatorial title"><input value={fields.title} onChange={e=>update('title',e.target.value)}/></Field><Field label="Description"><textarea rows="3" value={fields.description} onChange={e=>update('description',e.target.value)}/></Field><div className="grid sm:grid-cols-2 gap-4"><Field label="Category"><select value={fields.categoryId} onChange={e=>update('categoryId',e.target.value)}>{categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></Field><Field label="Tags (comma separated)"><input value={fields.tags.join(', ')} onChange={e=>update('tags',e.target.value.split(',').map(x=>x.trim()).filter(Boolean))}/></Field></div><div className="flex items-center justify-between p-4 bg-white border border-line rounded-xl"><div><div className="text-[11px] font-semibold">Feature this work</div><div className="text-[10px] text-stone-400 mt-1">Give it priority in the portfolio grid.</div></div><input type="checkbox" className="switch" checked={!!fields.featured} onChange={e=>update('featured',e.target.checked)}/></div><div className="p-3 bg-amber-50 border border-amber-200 rounded-lg text-[10px] text-amber-900">The metadata above is placeholder demo content. It was not generated by an AI model.</div></div><div className="p-5 sm:p-7 border-t border-line flex flex-wrap justify-between gap-2"><button onClick={onReject} className="px-4 py-2.5 border border-red-200 text-red-700 rounded-lg text-[10px]">Reject draft</button><div className="flex gap-2"><button onClick={onClose} className="px-4 py-2.5 border border-line rounded-lg text-[10px]">Save for later</button><button onClick={onApprove} className="px-4 py-2.5 bg-ink text-white rounded-lg text-[10px] font-semibold">Approve & publish</button></div></div></div></div>}

    function PublicSite({items,categories,settings,onBack,onOpen,publicCat,setPublicCat}){const list=items.filter(x=>publicCat==='all'||x.categoryId===publicCat);return <div className="min-h-[800px] bg-paper fade-up"><div className="max-w-7xl mx-auto px-5 sm:px-10 pt-8 sm:pt-14 pb-20"><div className="flex justify-between items-center mb-12"><button onClick={onBack} className="inline-flex items-center gap-2 text-[10px] font-semibold text-stone-600 hover:text-ink"><Icon name="arrow-left" size={14}/> Back to Studio CMS</button><span className="font-mono text-[9px] uppercase tracking-widest text-stone-400">Public site preview · Demo</span></div><div className="border-b border-stone-300 pb-10"><div className="font-mono text-[9px] uppercase tracking-[.22em] text-stone-400">Selected works · {settings.location}</div><h1 className="font-editorial text-5xl sm:text-7xl lg:text-8xl leading-[.92] max-w-4xl mt-6">{settings.headline}</h1><p className="text-[13px] sm:text-base text-stone-500 max-w-2xl mt-7 leading-relaxed">{settings.bio}</p></div><div className="flex flex-wrap gap-5 mt-7 mb-9">{[['all','All works'],...categories.map(c=>[c.id,c.name])].map(([id,label])=><button key={id} onClick={()=>setPublicCat(id)} className={`text-[10px] pb-1 ${publicCat===id?'border-b-2 border-ink font-bold':'text-stone-500'}`}>{label}</button>)}</div><div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-x-7 gap-y-12">{list.map(x=><article key={x.id} className="cursor-pointer group" onClick={()=>onOpen(x)}><div className="overflow-hidden bg-stone-200" style={{aspectRatio:x.ratio||1.3}}><img src={x.image} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"/></div><div className="flex justify-between gap-3 items-baseline border-b border-stone-300/70 mt-4 pb-2"><h3 className="font-editorial text-2xl">{x.title}</h3><span className="font-mono text-[8px] uppercase text-stone-400 shrink-0">{categories.find(c=>c.id===x.categoryId)?.name}</span></div><p className="text-[11px] text-stone-500 mt-2 leading-relaxed">{x.description}</p></article>)}</div>{!list.length&&<div className="py-24 text-center text-sm text-stone-400">No work in this collection.</div>}<div className="mt-20 pt-8 border-t border-stone-300 text-center font-mono text-[9px] uppercase tracking-[.18em] text-stone-400">Published with PortfolioPilot · UI prototype</div></div></div>}

    function Lightbox({item,category,onClose}){return <div className="fixed inset-0 z-[90] modal-backdrop flex items-center justify-center p-4" onClick={onClose}><div className="bg-paper rounded-xl shadow-panel max-w-4xl w-full overflow-hidden grid md:grid-cols-[1.2fr_.8fr]" onClick={e=>e.stopPropagation()}><img src={item.image} className="w-full h-72 md:h-[520px] object-cover"/><div className="p-6 sm:p-8 flex flex-col"><div className="flex justify-between"><span className="font-mono text-[9px] uppercase text-stone-400">{category?.name}</span><button onClick={onClose}><Icon name="x"/></button></div><h3 className="font-editorial text-4xl mt-8">{item.title}</h3><p className="text-[12px] text-stone-500 leading-relaxed mt-4">{item.description}</p><div className="flex flex-wrap gap-2 mt-5">{item.tags.map(t=><span key={t} className="bg-stone-100 rounded-full px-3 py-1 text-[9px]">#{t}</span>)}</div><div className="mt-auto pt-8 font-mono text-[9px] text-stone-400 uppercase">PortfolioPilot · Selected work</div></div></div></div>}

    function CategoryEditor({category,onClose,onSave}){const [name,setName]=useState(category.name);const [desc,setDesc]=useState(category.description);return <div className="fixed inset-0 z-[80] modal-backdrop flex items-center justify-center p-4"><div className="bg-paper w-full max-w-md p-6 rounded-2xl shadow-panel"><div className="flex justify-between"><h3 className="font-editorial text-3xl">Edit category</h3><button onClick={onClose}><Icon name="x"/></button></div><label className="block text-[9px] uppercase text-stone-500 mt-5 mb-1">Name</label><input value={name} onChange={e=>setName(e.target.value)} className="w-full bg-white border border-line rounded-lg p-3 text-[11px]"/><label className="block text-[9px] uppercase text-stone-500 mt-4 mb-1">Description</label><textarea value={desc} onChange={e=>setDesc(e.target.value)} rows="3" className="w-full bg-white border border-line rounded-lg p-3 text-[11px]"/><button onClick={()=>onSave({...category,name,description:desc,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')})} className="w-full mt-5 py-3 bg-ink text-white rounded-lg text-[11px]">Save changes</button></div></div>}

    const root=ReactDOM.createRoot(document.getElementById('root'));root.render(<App/>);
  </script>
</body>
</html>
